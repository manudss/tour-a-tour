name: android
on:
  workflow_dispatch:
  push:
    branches: [feat/**, main]
  pull_request:
jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Tests logique
        run: npm run test:logic
      - name: Clé de signature stable (secrets du dépôt)
        env:
          KS_B64: ${{ secrets.TDP_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then mkdir -p keystore && echo "$KS_B64" | base64 -d > keystore/release.jks && echo "KEYSTORE=keystore/release.jks" >> "$GITHUB_ENV"; echo "KEYSTORE_PASS=${{ secrets.TDP_KEYSTORE_PASS }}" >> "$GITHUB_ENV"; else echo "Pas de secret: clé de débogage éphémère"; fi
      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: bash scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with: { name: tour-de-parole-apk, path: build/tour-de-parole.apk }
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Version précédente (test de mise à jour)
        run: curl -sfL -o build/prev.apk https://github.com/manudss/tour-a-tour/releases/download/v0.1.0-test/tour-a-tour.apk || echo "pas de version précédente"
      - name: Test sur émulateur Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node tests/android-e2e.js
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-e2e, path: e2e-out/ }
